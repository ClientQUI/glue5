# The iOS app: a thin package around the glue5 library (the same crate as
# the desktop app). `mise run ios` / `ios:build` build the library, then
# generate the Xcode project (Glue5.xcodeproj, Info.plist: ignored by git)
# next to this file.
name: Glue5
options:
  deploymentTarget:
    iOS: "16.4"
settings:
  base:
    PRODUCT_NAME: Glue 5
    PRODUCT_BUNDLE_IDENTIFIER: com.lennertwilhelm.gta5offline
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ARCHS: arm64
    DEAD_CODE_STRIPPING: YES
    # iCloud uses team 9WKKC8XF38 with bundle com.lennertwilhelm.gta5offline.
    # Set GLUE5_TEAM to that id when signing (see the README, iCloud).
    DEVELOPMENT_TEAM: ${GLUE5_TEAM}
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_ENTITLEMENTS: Glue5.entitlements
    # The library built by cargo.
    OTHER_LDFLAGS: $(PROJECT_DIR)/../../target/aarch64-apple-ios/release/libglue5.a -liconv
targets:
  Glue5:
    type: application
    platform: iOS
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: Glue5
    scheme: {}
    sources:
      - path: main.c
      - path: ../shared/Glue5.icon
        buildPhase: resources
    dependencies:
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CoreAudio.framework
      - sdk: CoreBluetooth.framework
      - sdk: CoreFoundation.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreHaptics.framework
      - sdk: CoreMedia.framework
      - sdk: CoreMotion.framework
      - sdk: CoreVideo.framework
      - sdk: Foundation.framework
      - sdk: GameController.framework
      - sdk: Metal.framework
      - sdk: MetalFX.framework
      - sdk: OpenGLES.framework
      - sdk: QuartzCore.framework
      - sdk: UIKit.framework
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Glue 5
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        # ProMotion iPhones run faster than 60 Hz only with this.
        CADisableMinimumFrameDurationOnPhone: true
        # A game: Game Mode (iOS 18+) gives it the CPU and GPU first and
        # lowers Bluetooth controller latency while it is in front.
        LSApplicationCategoryType: public.app-category.games
        GCSupportsGameMode: true
        LSSupportsGameMode: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # The game goes in Documents/game (Finder / Files app).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Mouse and trackpad (iPad), game controllers.
        UIApplicationSupportsIndirectInputEvents: true
        GCSupportsControllerUserInteraction: true
        # GTA Online: players on the same network find each other there.
        NSLocalNetworkUsageDescription: Glue 5 finds GTA Online players on your network.
        # iCloud Drive shows this container when the capability is on the App ID.
        NSUbiquitousContainers:
          iCloud.com.lennertwilhelm.gta5offline:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Glue 5
            NSUbiquitousContainerSupportedFolderLevels: Any
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
